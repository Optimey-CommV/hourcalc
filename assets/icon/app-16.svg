<circle cx="128" cy="128" r="112" fill="#129DC4" clip-path="url(#tr)"/>
<circle cx="128" cy="128" r="112" fill="#129DC4" clip-path="url(#br)"/>
<circle cx="128" cy="128" r="112" fill="#129DC4" clip-path="url(#bl)"/>
